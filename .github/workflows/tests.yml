name: tests
# Offline: validates that every scenario's gates fail on the defect and pass on the reference fix (no model calls, no API keys).
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile dataopsbench.py run_arm.py run_judge.py
      - run: python dataopsbench.py validate
